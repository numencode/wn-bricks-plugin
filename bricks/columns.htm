{% set count = columns in ['3', 3] ? 3 : 2 %}
<div class="brick brick--columns brick--columns-{{ count }}{% if brick.class %} {{ brick.class }}{% endif %}"{% if brick.anchor %} id="{{ brick.anchor }}"{% endif %}>
    <div class="brick__column">{{ column_1|raw }}</div>
    <div class="brick__column">{{ column_2|raw }}</div>
    {% if count == 3 %}<div class="brick__column">{{ column_3|raw }}</div>{% endif %}
</div>
