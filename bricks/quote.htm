{% if quote %}
    <figure class="brick brick--quote{% if brick.class %} {{ brick.class }}{% endif %}"{% if brick.anchor %} id="{{ brick.anchor }}"{% endif %}>
        <blockquote class="brick__quote">{{ quote|nl2br }}</blockquote>
        {% if author or source %}
            <figcaption class="brick__caption">
                {% if author %}<span class="brick__author">{{ author }}</span>{% endif %}
                {% if source %}<cite class="brick__source">{{ source }}</cite>{% endif %}
            </figcaption>
        {% endif %}
    </figure>
{% endif %}
