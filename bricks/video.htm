{% set embed = url|bricksVideoUrl %}
{% if embed %}
    <div class="brick brick--video{% if brick.class %} {{ brick.class }}{% endif %}"{% if brick.anchor %} id="{{ brick.anchor }}"{% endif %}>
        <iframe class="brick__video" src="{{ embed }}" title="{{ title ?: 'Video' }}" loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
{% endif %}
