{% set columns = columns in ['2', '3', '4', 2, 3, 4] ? columns : 3 %}
{% set items = images is iterable ? images|filter(item => item.image is defined and item.image) : [] %}
{% if items|length %}
    <div class="brick brick--gallery brick--gallery-{{ columns }}">
        {% for item in items %}
            <figure class="brick__item">
                <a class="brick__link" href="{{ item.image|media }}" data-gallery="{{ brick.field }}-{{ brick.index }}">
                    <img class="brick__image" src="{{ item.image|media }}" alt="{{ item.alt }}" loading="lazy">
                </a>
                {% if item.caption %}<figcaption class="brick__caption">{{ item.caption }}</figcaption>{% endif %}
            </figure>
        {% endfor %}
    </div>
{% endif %}
